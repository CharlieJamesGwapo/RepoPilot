name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: repopilot
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: repopilot.exe
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary: repopilot
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: repopilot
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - name: Verify tag matches package
        shell: bash
        run: |
          python - <<'PY'
          import json, os, subprocess
          metadata = json.loads(subprocess.check_output(['cargo', 'metadata', '--no-deps', '--format-version', '1']))
          package = next(p for p in metadata['packages'] if p['name'] == 'repopilot')
          assert os.environ['GITHUB_REF_NAME'] == 'v' + package['version'], 'tag/package version mismatch'
          PY
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --all-targets --all-features --locked
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Verify release binary and package
        shell: bash
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_BINARY: ${{ matrix.binary }}
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, shutil, subprocess, tempfile
          target, binary = os.environ['RELEASE_TARGET'], os.environ['RELEASE_BINARY']
          source = pathlib.Path('target') / target / 'release' / binary
          subprocess.run([str(source.resolve()), '--version'], check=True)
          result = subprocess.run([str(source.resolve()), 'scan', '.', '--json'], check=True, capture_output=True, text=True)
          json.loads(result.stdout)
          dist = pathlib.Path('dist'); dist.mkdir()
          name = 'repopilot-' + os.environ['GITHUB_REF_NAME'] + '-' + target
          stage = pathlib.Path(tempfile.mkdtemp()) / name; stage.mkdir()
          shutil.copy2(source, stage / binary)
          for file in ['README.md', 'LICENSE', 'CHANGELOG.md']:
              shutil.copy2(file, stage / file)
          shutil.copytree('docs', stage / 'docs')
          archive = pathlib.Path(shutil.make_archive(str(dist / name), 'zip' if binary.endswith('.exe') else 'gztar', root_dir=stage.parent, base_dir=name))
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          (dist / (archive.name + '.sha256')).write_text(digest + '  ' + archive.name + '\n')
          with tempfile.TemporaryDirectory() as location:
              shutil.unpack_archive(str(archive), location)
              extracted = pathlib.Path(location) / name / binary
              extracted.chmod(extracted.stat().st_mode | 0o111)
              subprocess.run([str(extracted), '--version'], check=True)
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == digest
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: repopilot-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: repopilot-*
          merge-multiple: true
          path: dist
      - name: Verify checksums
        working-directory: dist
        run: sha256sum --check *.sha256
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "RepoPilot $GITHUB_REF_NAME" --generate-notes
