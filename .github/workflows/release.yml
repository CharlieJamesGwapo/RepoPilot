name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary: repopilot
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: repopilot.exe
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary: repopilot
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: repopilot
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - name: Verify tag matches package
        shell: bash
        run: |
          python - <<'PY'
          import json, os, subprocess
          metadata = json.loads(subprocess.check_output(['cargo', 'metadata', '--no-deps', '--format-version', '1']))
          package = next(p for p in metadata['packages'] if p['name'] == 'repopilot')
          assert os.environ['GITHUB_REF_NAME'] == 'v' + package['version'], 'tag/package version mismatch'
          PY
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --all-targets --all-features --locked
      - name: Offline POSIX installer regression tests
        run: python scripts/test_installers.py
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Verify release binary and package
        shell: bash
        run: python scripts/package_release.py --version "$GITHUB_REF_NAME" --target "${{ matrix.target }}" --binary "target/${{ matrix.target }}/release/${{ matrix.binary }}"
      - name: Windows installer regression tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test_windows_installer.ps1 -PackageDir dist -Version $env:GITHUB_REF_NAME
      - name: Windows PowerShell 5 installer regression tests
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/test_windows_installer.ps1 -PackageDir dist -Version $env:GITHUB_REF_NAME
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repopilot-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: repopilot-*
          merge-multiple: true
          path: dist
      - name: Include reviewed installers and checksums
        run: |
          cp install.sh install.ps1 dist/
          cd dist
          sha256sum install.sh > install.sh.sha256
          sha256sum install.ps1 > install.ps1.sha256
          sha256sum --check *.sha256
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "RepoPilot $GITHUB_REF_NAME" --notes-file "docs/releases/$GITHUB_REF_NAME.md"
  verify-downloads:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download and install published assets
        shell: bash
        run: python scripts/verify_release.py --version "$GITHUB_REF_NAME" --target "${{ matrix.target }}" --report "release-verification-${{ matrix.target }}.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-verification-${{ matrix.target }}
          path: release-verification-${{ matrix.target }}.json
          if-no-files-found: error
