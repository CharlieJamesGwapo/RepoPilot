[package]
name = "repopilot"
version = "0.3.0-rc.1"
edition = "2024"
description = "Local-first project diagnostics and provider-neutral developer assistance"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
ignore = "0.4"
ureq = { version = "3", default-features = false, features = ["json", "rustls"] }
url = "2"
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
